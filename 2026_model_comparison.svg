<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Simple shrinkage lowered 2026 K-BB% prediction error</title>
<desc id="desc">Mean absolute error across 275 pitchers: unchanged first-half rate 5.058, league rate 5.192, plain shrinkage 4.418, and frozen calibrated shrinkage 4.431 percentage points. Lower is better.</desc>
<rect width="1200" height="620" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="62" y="64" font-size="28" font-weight="600" fill="#171717">Simple shrinkage lowered 2026 prediction error</text>
<text x="62" y="100" font-size="18" fill="#5E6462">July-onward K-BB% · Same 275 pitchers · Lower MAE is better</text>
<line x1="62" y1="131" x2="1138" y2="131" stroke="#E4E7E5"/>
<line x1="470.0" y1="174" x2="470.0" y2="440" stroke="#E4E7E5"/>
<text x="470.0" y="470" text-anchor="middle" font-size="16" fill="#5E6462">4.2</text>
<line x1="600.0" y1="174" x2="600.0" y2="440" stroke="#E4E7E5"/>
<text x="600.0" y="470" text-anchor="middle" font-size="16" fill="#5E6462">4.5</text>
<line x1="730.0" y1="174" x2="730.0" y2="440" stroke="#E4E7E5"/>
<text x="730.0" y="470" text-anchor="middle" font-size="16" fill="#5E6462">4.8</text>
<line x1="860.0" y1="174" x2="860.0" y2="440" stroke="#E4E7E5"/>
<text x="860.0" y="470" text-anchor="middle" font-size="16" fill="#5E6462">5.1</text>
<line x1="990.0" y1="174" x2="990.0" y2="440" stroke="#E4E7E5"/>
<text x="990.0" y="470" text-anchor="middle" font-size="16" fill="#5E6462">5.4</text>
<text x="62" y="220" font-size="19" fill="#171717">First-half rate unchanged</text>
<circle cx="841.8" cy="214" r="8" fill="#777D7A"/>
<text x="863.8" y="220" font-size="20" font-weight="600" fill="#777D7A">5.058</text>
<text x="62" y="288" font-size="19" fill="#171717">First-half league rate</text>
<circle cx="899.9" cy="282" r="8" fill="#777D7A"/>
<text x="921.9" y="288" font-size="20" font-weight="600" fill="#777D7A">5.192</text>
<text x="62" y="356" font-size="19" fill="#171717">Plain 100-BF shrinkage</text>
<circle cx="564.5" cy="350" r="8" fill="#404846"/>
<text x="586.5" y="356" font-size="20" font-weight="600" fill="#404846">4.418</text>
<text x="62" y="424" font-size="19" fill="#171717">Frozen calibrated shrinkage</text>
<circle cx="570.1" cy="418" r="8" fill="#1F6F5F"/>
<text x="592.1" y="424" font-size="20" font-weight="600" fill="#1F6F5F">4.431</text>
<text x="730" y="505" text-anchor="middle" font-size="17" fill="#404846">Mean absolute error (percentage points)</text>
<line x1="62" y1="529" x2="1138" y2="529" stroke="#E4E7E5"/>
<text x="62" y="559" font-size="15" fill="#404846">Frozen vs plain shrinkage: 95% paired bootstrap interval for MAE improvement -0.089 to +0.065 pp.</text>
<text x="62" y="584" font-size="15" fill="#5E6462">Axis begins at 4.2 pp to reveal small differences; dots show absolute MAE, not improvement.</text>
</g></svg>
